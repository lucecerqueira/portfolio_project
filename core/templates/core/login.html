{% extends 'core/base.html' %}
{% block title %}Entrar | Lucenildo Silva Cerqueira, DSc.{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 40px auto; background-color: var(--surface); border: 1px solid var(--border-clay); border-radius: 18px; padding: 32px; box-shadow: var(--clay-shadow);">
  <h2 style="color: var(--accent); margin-bottom: 20px; text-align: center;">Entrar no Sistema</h2>
  {% if form.errors %}
    <p style="color: #f85149; font-size: 0.9rem; margin-bottom: 15px; text-align: center;">Usuário ou senha inválidos.</p>
  {% endif %}
  <form method="post" style="display: flex; flex-direction: column; gap: 16px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="padding: 12px; background-color: var(--accent); color: var(--bg-primary); border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">Entrar</button>
  </form>
  <div style="margin-top: 20px; text-align: center; font-size: 0.88rem;">
    <a href="{% url 'password_reset' %}" style="color: var(--accent); text-decoration: none;">Esqueceu sua senha?</a> | 
    <a href="{% url 'cadastro' %}" style="color: var(--accent); text-decoration: none;">Cadastre-se</a>
  </div>
</div>
<style>
  form p label { display: block; margin-bottom: 6px; color: var(--text-primary); font-size: 0.9rem; font-weight: 500; }
  form p input { width: 100%; padding: 10px 14px; background-color: var(--bg-primary); border: 1px solid var(--border-clay); border-radius: 8px; color: var(--text-primary); }
</style>
{% endblock %}
