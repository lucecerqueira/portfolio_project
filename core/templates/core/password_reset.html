{% extends 'core/base.html' %}
{% block title %}Recuperar Senha | Lucenildo Silva Cerqueira, DSc.{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 40px auto; background-color: var(--surface); border: 1px solid var(--border-clay); border-radius: 18px; padding: 32px; box-shadow: var(--clay-shadow);">
  <h2 style="color: var(--accent); margin-bottom: 12px; text-align: center;">Recuperação de Senha</h2>
  <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 20px; text-align: center;">Esqueceu sua senha? Digite seu e-mail abaixo para receber as instruções de redefinição.</p>
  <form method="post" style="display: flex; flex-direction: column; gap: 16px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="padding: 12px; background-color: var(--accent); color: var(--bg-primary); border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">Enviar e-mail de recuperação</button>
  </form>
</div>
<style>
  form p label { display: block; margin-bottom: 6px; color: var(--text-primary); font-size: 0.9rem; font-weight: 500; }
  form p input { width: 100%; padding: 10px 14px; background-color: var(--bg-primary); border: 1px solid var(--border-clay); border-radius: 8px; color: var(--text-primary); }
</style>
{% endblock %}
